# Prompt asset registry.
#
# Every prompt A.R.S sends is a file listed here. Nothing in services/compute may build a
# system prompt, a quarantine frame or a filler from an inline string literal — the reason
# is auditability: when a turn behaves badly, the question "which prompt version produced
# this" has to be answerable from the telemetry alone.
#
# `sha256` is computed at load time, not stored, so a hand-edit cannot go unnoticed in a
# telemetry trace. Bump `version` (v1 -> v2) by adding a NEW file; never edit a shipped
# version in place, because eval results are recorded against the version string.

registry_version = "1"

[[asset]]
id = "system"
version = "v1"
language = "en"
path = "system.en.v1.md"

[[asset]]
id = "system"
version = "v1"
language = "ro"
path = "system.ro.v1.md"

[[asset]]
id = "quarantine"
version = "v1"
language = "en"
path = "quarantine.en.v1.md"

[[asset]]
id = "quarantine"
version = "v1"
language = "ro"
path = "quarantine.ro.v1.md"

[[asset]]
id = "quarantine_flag"
version = "v1"
language = "en"
path = "quarantine_flag.en.v1.md"

[[asset]]
id = "quarantine_flag"
version = "v1"
language = "ro"
path = "quarantine_flag.ro.v1.md"

[[asset]]
id = "memory_frame"
version = "v1"
language = "en"
path = "memory_frame.en.v1.md"

[[asset]]
id = "memory_frame"
version = "v1"
language = "ro"
path = "memory_frame.ro.v1.md"

[[asset]]
id = "preferences_frame"
version = "v1"
language = "en"
path = "preferences_frame.en.v1.md"

[[asset]]
id = "preferences_frame"
version = "v1"
language = "ro"
path = "preferences_frame.ro.v1.md"

[[asset]]
id = "tool_use"
version = "v1"
language = "en"
path = "tool_use.en.v1.md"

[[asset]]
id = "tool_use"
version = "v1"
language = "ro"
path = "tool_use.ro.v1.md"

# --- German -------------------------------------------------------------------------
# Added when German became a third language. The per-language files are new bytes, not
# edits: v1 of every asset is exactly what it always was, so an eval recorded against
# system/v1/en still resolves to the same text and the same hash.

[[asset]]
id = "quarantine"
version = "v1"
language = "de"
path = "quarantine.de.v1.md"

[[asset]]
id = "quarantine_flag"
version = "v1"
language = "de"
path = "quarantine_flag.de.v1.md"

[[asset]]
id = "memory_frame"
version = "v1"
language = "de"
path = "memory_frame.de.v1.md"

[[asset]]
id = "preferences_frame"
version = "v1"
language = "de"
path = "preferences_frame.de.v1.md"

[[asset]]
id = "tool_use"
version = "v1"
language = "de"
path = "tool_use.de.v1.md"

# The system prompt is the one asset whose EXISTING text went stale: it enumerated the
# languages A.R.S speaks, and that sentence became wrong. Editing v1 in place is
# forbidden, so v1 stays untouched and v2 supersedes it in all three languages.

[[asset]]
id = "system"
version = "v2"
language = "en"
path = "system.en.v2.md"

[[asset]]
id = "system"
version = "v2"
language = "ro"
path = "system.ro.v2.md"

[[asset]]
id = "system"
version = "v2"
language = "de"
path = "system.de.v2.md"

# tool_use v2: v1 stopped after a search and handed the user a list of links. The rule
# that a search result is a place to look, not an answer, is added rather than implied.
[[asset]]
id = "tool_use"
version = "v2"
language = "en"
path = "tool_use.en.v2.md"

[[asset]]
id = "tool_use"
version = "v2"
language = "ro"
path = "tool_use.ro.v2.md"

[[asset]]
id = "tool_use"
version = "v2"
language = "de"
path = "tool_use.de.v2.md"

# The clock. A model has no idea what day it is, and said so — Alex asked for the date and
# was told A.R.S has no access to it. It is ambient context, like the language, not a tool
# call: asking the GPU what day it is would be absurd.
[[asset]]
id = "now"
version = "v1"
language = "en"
path = "now.en.v1.md"

[[asset]]
id = "now"
version = "v1"
language = "ro"
path = "now.ro.v1.md"

[[asset]]
id = "now"
version = "v1"
language = "de"
path = "now.de.v1.md"
