[project]
name = "ars-auth"
version = "0.1.0"
description = "A.R.S auth — the guard, grants, consent, OAuth token vault and audit log"
requires-python = ">=3.11"
authors = [{ name = "Alexandru Stratulat", email = "alex.ccoin@gmail.com" }]
license = { file = "../../LICENSE" }
dependencies = [
    "ars-protocol",
    "ars-core",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    # Fernet for the fallback encrypted token file. The macOS Keychain is the primary
    # backend; this is what keeps tokens encrypted at rest on a box without one.
    "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ars_auth"]

# Migrations live in data/migrations/ (one source of truth) and are copied into the
# wheel so an installed service can bootstrap its own schema without the repo present.
[tool.hatch.build.targets.wheel.force-include]
"data/migrations" = "ars_auth/_bundled/migrations"
