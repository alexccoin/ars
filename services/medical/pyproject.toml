[project]
name = "ars-medical"
version = "0.1.0"
description = "A.R.S personal medical store — vital readings, reference ranges, findings. Fully local, SQLite-backed. No diagnosis."
requires-python = ">=3.11"
authors = [{ name = "Alexandru Stratulat", email = "alex.ccoin@gmail.com" }]
license = { file = "../../LICENSE" }
dependencies = [
    "ars-protocol",
    "ars-core",
    "ars-telemetry",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ars_medical"]
