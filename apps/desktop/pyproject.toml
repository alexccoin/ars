[project]
name = "ars-desktop"
version = "0.1.0"
description = "A.R.S desktop shell — native macOS window over the local gateway"
requires-python = ">=3.12"
authors = [{ name = "Alexandru Stratulat", email = "alex.ccoin@gmail.com" }]
license = { file = "../../LICENSE" }
dependencies = [
    "ars-gateway",
    "pywebview>=6.2,<7",
]

# Build-time only (not imported at runtime, not bundled by PyInstaller into the app):
#   pyinstaller>=6.22,<7
#   pillow>=12,<13          (icon generation script only)
# Installed straight into .venv with `uv pip install`, not declared as a runtime
# dependency group, so they never end up as a hard requirement of the frozen app.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ars_desktop"]
