<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.R.S — console</title>

<!-- Owned by the artifact-engineer. Loaded optimistically: if it does not exist yet, the
     fallback tokens defined in the <style> block below keep this page fully usable. -->
<link rel="stylesheet" href="./theme.css">

<style>
  /* ===================================================================================
   * FALLBACK DESIGN TOKENS — documented, per the frontend/artifact contract.
   *
   * These are guesses at names a sci-fi design-token system would use. `theme.css` is
   * expected to define the SAME custom-property names on `:root` (or override them);
   * until it exists (or if it uses different names), the values below keep the console
   * legible and in the JARVIS/HUD register. Every rule in this file reads through
   * `var(--token, fallback)` — no bare hex/px anywhere else in this stylesheet.
   *
   * If the real theme.css lands with different names, only this block needs editing.
   * =================================================================================== */
  :root {
    --ars-color-bg: #05080a;
    --ars-color-bg-elevated: #0b1216;
    --ars-color-bg-inset: #020304;
    --ars-color-border: #163238;
    --ars-color-border-strong: #1f4a52;
    --ars-color-fg: #d6f5f0;
    --ars-color-fg-dim: #7fa8a3;
    --ars-color-fg-faint: #4c6b68;
    --ars-color-accent: #29f1d6;
    --ars-color-accent-strong: #6ffff0;
    --ars-color-accent-2: #ffb454;
    --ars-color-ok: #4ee08a;
    --ars-color-warn: #ffcc4d;
    --ars-color-danger: #ff5c6c;
    --ars-color-cloud: #c792ea;

    --ars-font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    --ars-font-sans: -apple-system, 'Segoe UI', sans-serif;

    --ars-space-1: 4px;
    --ars-space-2: 8px;
    --ars-space-3: 12px;
    --ars-space-4: 16px;
    --ars-space-5: 24px;
    --ars-space-6: 32px;

    --ars-radius-sm: 2px;
    --ars-radius-md: 6px;
    --ars-radius-lg: 10px;

    --ars-glow-accent: 0 0 8px rgba(41, 241, 214, 0.55);
    --ars-glow-danger: 0 0 10px rgba(255, 92, 108, 0.6);
    --ars-glow-warn: 0 0 10px rgba(255, 204, 77, 0.5);

    --ars-transition-fast: 120ms ease;
    --ars-transition-medium: 240ms ease;

    --ars-z-panels: 10;
    --ars-z-banner: 40;
    --ars-z-dropzone: 50;
    --ars-z-consent: 60;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--color-bg, var(--ars-color-bg));
    color: var(--color-fg, var(--ars-color-fg));
    font-family: var(--font-mono, var(--ars-font-mono));
    font-size: 14px;
    line-height: 1.45;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .skip-link {
    position: absolute; left: -999px; top: 0; z-index: 100;
    background: var(--color-accent, var(--ars-color-accent));
    color: var(--ars-color-bg-inset);
    padding: var(--ars-space-2) var(--ars-space-4);
    border-radius: 0 0 var(--ars-radius-md) 0;
    font-weight: 600;
  }
  .skip-link:focus { left: 0; }

  :focus-visible {
    outline: 2px solid var(--color-accent, var(--ars-color-accent));
    outline-offset: 2px;
  }

  button {
    font-family: inherit;
    font-size: inherit;
    color: var(--color-fg, var(--ars-color-fg));
    background: var(--ars-color-bg-elevated);
    border: 1px solid var(--ars-color-border-strong);
    border-radius: var(--ars-radius-md);
    padding: var(--ars-space-1) var(--ars-space-3);
    cursor: pointer;
    transition: border-color var(--ars-transition-fast), box-shadow var(--ars-transition-fast);
  }
  button:hover:not(:disabled) { border-color: var(--color-accent, var(--ars-color-accent)); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    color: var(--color-fg, var(--ars-color-fg));
    background: var(--ars-color-bg-inset);
    border: 1px solid var(--ars-color-border);
    border-radius: var(--ars-radius-sm);
    padding: var(--ars-space-2);
  }

  /* ---------- app shell ---------- */
  .app {
    display: grid;
    grid-template-rows: auto auto 1fr;
    height: 100vh;
  }

  .app__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--ars-space-4);
    padding: var(--ars-space-3) var(--ars-space-5);
    border-bottom: 1px solid var(--ars-color-border);
    background: linear-gradient(180deg, var(--ars-color-bg-elevated), transparent);
  }
  .app__brand { display: flex; align-items: center; gap: var(--ars-space-3); }
  .app__entity {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--ars-color-border-strong);
    border-radius: 50%;
    box-shadow: var(--ars-glow-accent);
  }
  .app__titles h1 {
    margin: 0; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--color-accent, var(--ars-color-accent));
    text-shadow: var(--ars-glow-accent);
  }
  .app__subtitle { margin: 0; font-size: 11px; color: var(--ars-color-fg-dim); }
  .app__hud { display: flex; align-items: center; gap: var(--ars-space-4); flex: 1; justify-content: center; }
  .app__gpu-gauge { min-width: 160px; }
  .app__controls select { min-width: 110px; }

  #banner-region {
    position: sticky; top: 0; z-index: var(--ars-z-banner);
  }
  .banner {
    padding: var(--ars-space-2) var(--ars-space-5);
    font-size: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: var(--ars-space-3);
  }
  .banner--offline { background: rgba(255, 92, 108, 0.15); color: var(--ars-color-danger); border-bottom: 1px solid var(--ars-color-danger); }
  .banner--warn { background: rgba(255, 204, 77, 0.12); color: var(--ars-color-warn); border-bottom: 1px solid var(--ars-color-warn); }
  .banner--info { background: rgba(41, 241, 214, 0.1); color: var(--color-accent, var(--ars-color-accent)); border-bottom: 1px solid var(--ars-color-border-strong); }
  .banner__dismiss { background: transparent; border: none; }

  .app__main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: var(--ars-space-4);
    padding: var(--ars-space-4) var(--ars-space-5);
    min-height: 0;
  }
  @media (max-width: 860px) {
    .app__main { grid-template-columns: 1fr; }
  }

  /* ---------- console ---------- */
  .console {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 1px solid var(--ars-color-border);
    border-radius: var(--ars-radius-lg);
    background: var(--ars-color-bg-elevated);
    overflow: hidden;
  }
  .console__log {
    flex: 1;
    overflow-y: auto;
    padding: var(--ars-space-4);
    display: flex;
    flex-direction: column;
    gap: var(--ars-space-3);
  }
  .console__line { display: flex; gap: var(--ars-space-2); align-items: baseline; flex-wrap: wrap; }
  .console__who {
    flex-shrink: 0;
    min-width: 3.5em;
    color: var(--ars-color-fg-faint);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.08em;
  }
  .console__line--user .console__who { color: var(--ars-color-accent-2); }
  .console__line--ars .console__who { color: var(--color-accent, var(--ars-color-accent)); }
  .console__body { white-space: pre-wrap; word-break: break-word; }
  .console__cursor {
    display: inline-block; width: 0.55em; height: 1em; margin-left: 2px;
    background: var(--color-accent, var(--ars-color-accent));
    animation: ars-blink 1s step-end infinite;
    vertical-align: text-bottom;
  }
  @keyframes ars-blink { 50% { opacity: 0; } }

  .console__line--system { font-style: italic; color: var(--ars-color-fg-dim); font-size: 12px; }
  .console__line--warn { color: var(--ars-color-warn); }
  .console__line--error { color: var(--ars-color-danger); }

  .console__turn { display: flex; flex-direction: column; gap: var(--ars-space-2); }
  .console__turn--cancelled .console__body { color: var(--ars-color-fg-faint); }
  .console__cancelled-tag {
    font-size: 10px; text-transform: uppercase; color: var(--ars-color-warn);
    border: 1px solid var(--ars-color-warn); border-radius: var(--ars-radius-sm);
    padding: 0 4px; margin-left: var(--ars-space-2);
  }
  .console__turn--error .console__body { color: var(--ars-color-danger); }
  .console__error { color: var(--ars-color-danger); font-size: 12px; }

  .console__activity { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .console__activity-item {
    font-size: 11px; color: var(--ars-color-fg-dim);
    padding-left: calc(3.5em + var(--ars-space-2));
    display: flex; gap: var(--ars-space-2); align-items: center;
  }
  .console__activity-item--ask { color: var(--ars-color-warn); }
  .console__activity-item--deny { color: var(--ars-color-danger); }
  .console__activity-status { font-size: 10px; text-transform: uppercase; opacity: 0.8; }
  .console__activity-status--error, .console__activity-status--denied { color: var(--ars-color-danger); }

  .console__tier-slot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ars-space-2); padding-left: calc(3.5em + var(--ars-space-2)); font-size: 11px; }
  .console__actions { padding-left: calc(3.5em + var(--ars-space-2)); }

  .tier-badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 6px; border-radius: var(--ars-radius-sm); border: 1px solid currentColor;
  }
  .tier-badge--recall { color: var(--ars-color-fg-dim); }
  .tier-badge--documents { color: var(--ars-color-ok); }
  .tier-badge--local-model { color: var(--ars-color-accent-2); }
  .tier-badge--cloud-model { color: var(--ars-color-cloud); }
  .tier-meta { color: var(--ars-color-fg-dim); }
  .tier-reason { flex-basis: 100%; color: var(--ars-color-fg-dim); font-size: 11px; }
  .tier-citations { flex-basis: 100%; color: var(--ars-color-fg-faint); font-size: 10px; }
  .tier-cost { font-size: 10px; text-transform: uppercase; padding: 1px 5px; border-radius: var(--ars-radius-sm); }
  .tier-cost--free { color: var(--ars-color-bg-inset); background: var(--ars-color-ok); }
  .tier-cost--spent { color: var(--ars-color-bg-inset); background: var(--ars-color-accent-2); box-shadow: var(--ars-glow-warn); }

  .console__escalate {
    border-color: var(--ars-color-warn); color: var(--ars-color-warn);
    box-shadow: var(--ars-glow-warn);
    font-size: 12px;
  }

  .console__form {
    display: flex; gap: var(--ars-space-2);
    padding: var(--ars-space-3);
    border-top: 1px solid var(--ars-color-border);
    background: var(--ars-color-bg-inset);
  }
  .console__input { flex: 1; }
  .console__mic[data-state="denied"] { border-color: var(--ars-color-danger); color: var(--ars-color-danger); }
  .console__mic[data-state="active"] { border-color: var(--ars-color-ok); color: var(--ars-color-ok); box-shadow: var(--ars-glow-accent); }
  .console__stop { border-color: var(--ars-color-danger); color: var(--ars-color-danger); }

  /* ---------- HUD panel chrome (fallback; artifact-engineer's hud.js may replace visuals) ---------- */
  .app__panels {
    display: flex; flex-direction: column; gap: var(--ars-space-3);
    overflow-y: auto; min-height: 0;
  }
  .hud-panel {
    border: 1px solid var(--ars-color-border);
    border-radius: var(--ars-radius-lg);
    background: var(--ars-color-bg-elevated);
  }
  .hud-panel__header {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--ars-space-2) var(--ars-space-3);
    border-bottom: 1px solid var(--ars-color-border);
  }
  .hud-panel__title { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-accent, var(--ars-color-accent)); }
  .hud-panel__toggle { padding: 0 var(--ars-space-2); }
  .hud-panel__body { padding: var(--ars-space-3); display: flex; flex-direction: column; gap: var(--ars-space-2); max-height: 40vh; overflow-y: auto; }

  .panel-hint { margin: 0; font-size: 11px; color: var(--ars-color-fg-dim); }
  .panel-messages { display: flex; flex-direction: column; gap: 4px; }
  .panel-message { font-size: 11px; padding: 4px 6px; border-radius: var(--ars-radius-sm); }
  .panel-message--info { background: rgba(41, 241, 214, 0.08); color: var(--color-accent, var(--ars-color-accent)); }
  .panel-message--warn { background: rgba(255, 204, 77, 0.1); color: var(--ars-color-warn); }
  .panel-message--error { background: rgba(255, 92, 108, 0.1); color: var(--ars-color-danger); }

  /* documents */
  .docs__pick-btn { display: inline-block; }
  .docs__pick-btn.is-disabled { opacity: 0.5; pointer-events: none; }
  .docs__uploads { display: flex; flex-direction: column; gap: var(--ars-space-2); }
  .docs__upload-row { font-size: 11px; }
  .docs__upload-name { display: block; margin-bottom: 2px; color: var(--ars-color-fg-dim); }
  .docs__upload-bar { height: 4px; background: var(--ars-color-bg-inset); border-radius: 2px; overflow: hidden; }
  .docs__upload-fill { height: 100%; width: 0; background: var(--color-accent, var(--ars-color-accent)); transition: width var(--ars-transition-fast); }
  .docs__upload-stage { color: var(--ars-color-fg-faint); }
  [data-stage="learned"] .docs__upload-fill { background: var(--ars-color-ok); }
  [data-stage="error"] .docs__upload-fill { background: var(--ars-color-danger); }
  .docs__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--ars-space-2); }
  .docs__item { display: flex; align-items: center; gap: var(--ars-space-2); font-size: 11px; border-bottom: 1px solid var(--ars-color-border); padding-bottom: var(--ars-space-2); }
  .docs__name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .docs__meta { color: var(--ars-color-fg-dim); }
  .docs__delete { font-size: 10px; border-color: var(--ars-color-danger); color: var(--ars-color-danger); }
  .docs__empty { font-size: 11px; color: var(--ars-color-fg-faint); }

  /* grants */
  .grants__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--ars-space-2); }
  .grants__item { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--ars-space-2); font-size: 11px; border-bottom: 1px solid var(--ars-color-border); padding-bottom: var(--ars-space-2); }
  .grants__cap { font-weight: 600; color: var(--color-accent, var(--ars-color-accent)); }
  .grants__scope, .grants__confirm, .grants__expiry { color: var(--ars-color-fg-dim); grid-column: 1; }
  .grants__revoke { grid-row: 1 / span 4; grid-column: 2; align-self: start; border-color: var(--ars-color-danger); color: var(--ars-color-danger); font-size: 10px; }
  .grants__empty { font-size: 11px; color: var(--ars-color-fg-faint); }

  /* audit */
  .audit__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column-reverse; gap: 2px; }
  .audit__row { display: flex; gap: var(--ars-space-2); font-size: 10.5px; flex-wrap: wrap; padding: 2px 0; border-bottom: 1px dotted var(--ars-color-border); }
  .audit__time { color: var(--ars-color-fg-faint); }
  .audit__cap { color: var(--color-accent, var(--ars-color-accent)); }
  .audit__row--deny .audit__verdict { color: var(--ars-color-danger); }
  .audit__row--ask .audit__verdict { color: var(--ars-color-warn); }
  .audit__row--allow .audit__verdict { color: var(--ars-color-ok); }
  .audit__tainted-tag { color: var(--ars-color-danger); text-transform: uppercase; font-size: 9px; }
  .audit__empty { font-size: 11px; color: var(--ars-color-fg-faint); }

  /* status */
  .status__facts { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--ars-space-3); font-size: 11px; margin: 0; }
  .status__facts dt { color: var(--ars-color-fg-dim); }
  .status__facts dd { margin: 0; }
  .status__tiers { width: 100%; font-size: 11px; border-collapse: collapse; }
  .status__tiers td { padding: 2px 0; border-bottom: 1px dotted var(--ars-color-border); }
  .status__refresh { align-self: flex-start; font-size: 11px; }

  /* hud gauge / pip fallback visuals */
  .hud-gauge { display: flex; flex-direction: column; gap: 2px; font-size: 10px; }
  .hud-gauge__track { height: 6px; background: var(--ars-color-bg-inset); border-radius: 3px; overflow: hidden; }
  .hud-gauge__fill { height: 100%; background: var(--color-accent, var(--ars-color-accent)); box-shadow: var(--ars-glow-accent); transition: width var(--ars-transition-medium); }
  .hud-gauge__label { color: var(--ars-color-fg-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .hud-gauge__value { color: var(--color-accent, var(--ars-color-accent)); font-weight: 600; }

  .hud-pip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .hud-pip__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ars-color-fg-faint); display: inline-block; }
  .hud-pip--active .hud-pip__dot, .hud-pip--online .hud-pip__dot { background: var(--ars-color-ok); box-shadow: 0 0 6px var(--ars-color-ok); }
  .hud-pip--warn .hud-pip__dot, .hud-pip--connecting .hud-pip__dot { background: var(--ars-color-warn); box-shadow: 0 0 6px var(--ars-color-warn); }
  .hud-pip--error .hud-pip__dot, .hud-pip--offline .hud-pip__dot { background: var(--ars-color-danger); box-shadow: 0 0 6px var(--ars-color-danger); }
  .hud-pip--off .hud-pip__dot { background: var(--ars-color-fg-faint); }

  /* entity fallback (real visual owned by artifact-engineer's entity/ars-entity.js) */
  .entity-fallback { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .entity-fallback__core {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--color-accent, var(--ars-color-accent));
    box-shadow: 0 0 calc(6px + 10px * var(--entity-intensity, 0.2)) var(--color-accent, var(--ars-color-accent));
    transition: box-shadow var(--ars-transition-medium);
  }
  .entity-fallback[data-state="thinking"] .entity-fallback__core { animation: ars-pulse 1.1s ease-in-out infinite; }
  .entity-fallback[data-state="listening"] .entity-fallback__core { border-color: var(--ars-color-ok); }
  .entity-fallback[data-state="speaking"] .entity-fallback__core { border-color: var(--ars-color-accent-2); }
  .entity-fallback[data-state="error"] .entity-fallback__core { border-color: var(--ars-color-danger); }
  .entity-fallback[data-state="waiting_for_consent"] .entity-fallback__core { border-color: var(--ars-color-cloud); animation: ars-pulse 0.6s ease-in-out infinite; }
  .entity-fallback__label { display: none; }
  @keyframes ars-pulse { 50% { transform: scale(1.25); } }

  /* dropzone */
  .dropzone-overlay {
    position: fixed; inset: 0; z-index: var(--ars-z-dropzone);
    display: flex; align-items: center; justify-content: center;
    background: rgba(2, 3, 4, 0.85);
    border: 3px dashed var(--color-accent, var(--ars-color-accent));
    color: var(--color-accent, var(--ars-color-accent));
    font-size: 20px;
    text-align: center;
    padding: var(--ars-space-6);
  }

  /* consent */
  .consent-overlay {
    position: fixed; inset: 0; z-index: var(--ars-z-consent);
    display: flex; align-items: center; justify-content: center;
    background: rgba(2, 3, 4, 0.9);
    padding: var(--ars-space-4);
  }
  .consent-dialog {
    max-width: 480px; width: 100%;
    background: var(--ars-color-bg-elevated);
    border: 2px solid var(--ars-color-warn);
    box-shadow: var(--ars-glow-warn);
    border-radius: var(--ars-radius-lg);
    padding: var(--ars-space-5);
    display: flex; flex-direction: column; gap: var(--ars-space-3);
  }
  .consent-dialog__title { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ars-color-warn); }
  .consent-dialog__prompt { margin: 0; font-size: 15px; line-height: 1.5; }
  .consent-dialog__facts { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--ars-space-3); font-size: 11px; margin: 0; }
  .consent-dialog__facts dt { color: var(--ars-color-fg-dim); }
  .consent-dialog__facts dd { margin: 0; word-break: break-word; }
  .consent-dialog__actions { display: flex; gap: var(--ars-space-2); flex-wrap: wrap; justify-content: flex-end; }
  .consent-dialog__deny { border-color: var(--ars-color-danger); color: var(--ars-color-danger); }
  .consent-dialog__approve { border-color: var(--ars-color-ok); color: var(--ars-color-ok); }
  .consent-dialog__approve-remember { border-color: var(--color-accent, var(--ars-color-accent)); color: var(--color-accent, var(--ars-color-accent)); }
</style>
</head>
<body>
  <a class="skip-link" href="#console-input" data-i18n="app.skip_to_console">Skip to console input</a>

  <div id="app" class="app">
    <header class="app__header">
      <div class="app__brand">
        <div id="entity-mount" class="app__entity" aria-hidden="true"></div>
        <div class="app__titles">
