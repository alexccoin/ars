[project]
name = "ars-protocol"
version = "0.1.0"
description = "A.R.S wire contracts — the single source of truth for every message crossing a boundary"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ars_protocol"]
