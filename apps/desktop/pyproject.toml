[project]
name = "ars-desktop"
version = "0.1.0"
description = "A.R.S desktop shell — native macOS window over the local gateway"
requires-python = ">=3.12"
authors = [{ name = "Alexandru Stratulat", email = "alex.ccoin@gmail.com" }]
license = { file = "../../LICENSE" }
dependencies = [
    "ars-gateway",
    "pywebview>=6.2,<7",
]

# Build-time only: never imported at runtime, never bundled by PyInstaller into the
# app (PyInstaller freezes by following imports reachable from the entry script — a
# tool that builds the app is not on that graph). Kept out of `dependencies` above for
# that reason, but still locked and workspace-tracked (not a hand `uv pip install`) so
# `uv sync` never silently removes it from underneath a build. Install on demand with:
#   uv sync --package ars-desktop --group build --inexact
# (--inexact matters: without it, `--package` scopes to an *exact* sync of only
# ars-desktop's own closure and uninstalls everything else in .venv — the voice/memory
# backends included. `packaging/build_macos.sh` checks for both packages and fails
# loudly, with that exact command, rather than proceeding without them.)
[dependency-groups]
build = [
    "pyinstaller>=6.22,<7",
    "pillow>=12,<13",          # icon generation only
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ars_desktop"]
