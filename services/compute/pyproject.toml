[project]
name = "ars-compute"
version = "0.1.0"
description = "A.R.S reasoning layer — context assembly, LLM backends, turn orchestration, behaviour learning"
requires-python = ">=3.11"
dependencies = ["ars-protocol", "ars-core", "pydantic>=2.9", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ars_compute"]

[tool.hatch.build.targets.wheel.force-include]
"src/ars_compute/prompts" = "ars_compute/prompts"
