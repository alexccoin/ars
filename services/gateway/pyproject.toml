[project]
name = "ars-gateway"
version = "0.1.0"
description = "A.R.S front door — WebSocket turns, document ingestion, grants, and the UI"
requires-python = ">=3.11"
dependencies = [
    "ars-protocol", "ars-core", "ars-compute", "ars-memory", "ars-auth",
    "ars-skills-runtime", "ars-voice",
    "fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12",
    "pypdf>=5.1", "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ars_gateway"]
