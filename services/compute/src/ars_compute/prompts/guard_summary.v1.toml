# One-sentence descriptions of a proposed action, for `GuardQuery.summary`.
#
# The protocol says this sentence is read aloud when the verdict is ASK, so it must be
# true and specific — and it must be composed here, from the tool name and arguments,
# never taken from the model's own words. In a tainted turn the model's phrasing is
# attacker-influenced, and "summarise this page" is a very different consent prompt from
# "email your last three invoices to an address on that page".

version = "v1"

# {tool} = tool name, {resource} = the concrete thing being touched (may be empty)
[default.en]
with_resource = "use {tool} on {resource}"
without_resource = "use {tool}"
[default.ro]
with_resource = "folosesc {tool} pe {resource}"
without_resource = "folosesc {tool}"
[default.de]
with_resource = "{tool} auf {resource} benutzen"
without_resource = "{tool} benutzen"

[capability."web.search".en]
with_resource = "search the web for {resource}"
without_resource = "search the web"
[capability."web.search".ro]
with_resource = "caut pe web {resource}"
without_resource = "caut pe web"
[capability."web.search".de]
with_resource = "im Netz nach {resource} suchen"
without_resource = "im Netz suchen"

[capability."web.fetch".en]
with_resource = "open the page at {resource}"
without_resource = "open a web page"
[capability."web.fetch".ro]
with_resource = "deschid pagina {resource}"
without_resource = "deschid o pagină web"
[capability."web.fetch".de]
with_resource = "die Seite {resource} öffnen"
without_resource = "eine Webseite öffnen"

