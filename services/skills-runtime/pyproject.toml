[project]
name = "ars-skills-runtime"
version = "0.1.0"
description = "Sandboxed skill execution — the last line before A.R.S touches the real world"
requires-python = ">=3.11"
dependencies = ["ars-protocol", "ars-core", "httpx>=0.27", "selectolax>=0.3.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ars_skills"]
